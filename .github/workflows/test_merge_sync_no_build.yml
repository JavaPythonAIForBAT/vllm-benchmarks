name: "TEST: merge + sync (no build)"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-merge:
    runs-on: linux-amd64-cpu-4
    steps:
      - name: Login to SWR
        uses: docker/login-action@v4
        with:
          registry: swr.cn-north-12.myhuaweicloud.com
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Merge two single-arch images
        run: |
          REGISTRY="swr.cn-north-12.myhuaweicloud.com/atlas_inference/vllm-atlas-temp"

          echo "=== Merging into multi-arch manifest (PR #322 logic) ==="
          docker buildx imagetools create \
            -t "$REGISTRY:test-merge-multi-v2s2" \
            "$REGISTRY:test-merge-amd64-v2s2" \
            "$REGISTRY:test-merge-arm64-v2s2" 2>&1

          echo "=== Verifying merged manifest ==="
          docker buildx imagetools inspect "$REGISTRY:test-merge-multi-v2s2" 2>&1

      - name: Trigger quay.io sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOOLS_TOKEN }}
        run: |
          gh workflow run sync-vllm-ascend.yml \
            --repo ascend-gha-runners/sync-tools